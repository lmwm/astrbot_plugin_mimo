<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源查询插件管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      color: #333;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    h1 { font-size: 24px; margin-bottom: 20px; color: #1a1a1a; }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }

    .tab {
      padding: 10px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .tab:hover { border-color: #1976d2; }
    .tab.active { background: #1976d2; color: white; border-color: #1976d2; }

    /* Panels */
    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1976d2;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Account List */
    .account-list { display: flex; flex-direction: column; gap: 12px; }

    .account-card {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 16px;
      transition: all 0.2s;
    }

    .account-card:hover { border-color: #1976d2; }

    .account-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .account-name {
      font-weight: 600;
      font-size: 16px;
    }

    .account-platform {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .platform-mimo { background: #e3f2fd; color: #1565c0; }
    .platform-wasu { background: #e8f5e9; color: #2e7d32; }

    .account-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      font-size: 13px;
      color: #666;
    }

    .account-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }

    .form-group.full-width { grid-column: 1 / -1; }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: #555;
    }

    .form-input, .form-select, .form-textarea {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: #1976d2;
    }

    .form-textarea {
      min-height: 200px;
      font-family: 'Consolas', 'Monaco', monospace;
      resize: vertical;
    }

    .form-hint {
      font-size: 12px;
      color: #888;
    }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: #1976d2; color: white; }
    .btn-primary:hover { background: #1565c0; }

    .btn-success { background: #2e7d32; color: white; }
    .btn-success:hover { background: #1b5e20; }

    .btn-danger { background: #c62828; color: white; }
    .btn-danger:hover { background: #b71c1c; }

    .btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
    .btn-secondary:hover { background: #eee; }

    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: white;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* Status */
    .status {
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }

    .status.show { display: block; }
    .status.success { background: #e8f5e9; color: #2e7d32; }
    .status.error { background: #ffebee; color: #c62828; }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
    }

    .empty-state-icon { font-size: 48px; margin-bottom: 12px; }

    /* Template Editor */
    .editor-panel { display: flex; gap: 20px; }

    .editor-section { flex: 1; }

    .preview-section { flex: 1; }

    .preview {
      width: 100%;
      min-height: 300px;
      padding: 16px;
      border: 1px solid #eee;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      background: #fafafa;
    }

    .variables {
      margin-top: 16px;
      padding: 12px;
      background: #f0f7ff;
      border-radius: 8px;
    }

    .variable-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .variable {
      padding: 4px 8px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
    }

    .variable:hover { background: #1976d2; color: white; border-color: #1976d2; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 资源查询插件管理</h1>

    <div class="tabs">
      <div class="tab active" data-tab="accounts">账号管理</div>
      <div class="tab" data-tab="templates">消息模板</div>
    </div>

    <!-- 账号管理面板 -->
    <div class="panel" id="accounts-panel">
      <div class="panel-title">
        <span>账号列表</span>
        <button class="btn btn-primary" onclick="showAddModal()">+ 添加账号</button>
      </div>
      <div id="status-accounts" class="status"></div>
      <div class="account-list" id="account-list">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div>暂无账号，点击上方按钮添加</div>
        </div>
      </div>
    </div>

    <!-- 消息模板面板 -->
    <div class="panel" id="templates-panel" style="display:none">
      <div class="panel-title">
        <span>消息模板编辑</span>
        <div>
          <button class="btn btn-secondary btn-sm" onclick="resetTemplate()">重置为默认</button>
          <button class="btn btn-primary btn-sm" onclick="saveTemplate()">保存模板</button>
        </div>
      </div>
      <div id="status-template" class="status"></div>

      <div class="tabs" style="margin-bottom:16px">
        <div class="tab active" data-tab="mimo" onclick="switchTemplateTab('mimo')">MiMo 模板</div>
        <div class="tab" data-tab="wasu" onclick="switchTemplateTab('wasu')">华数广电模板</div>
      </div>

      <div class="editor-panel">
        <div class="editor-section">
          <textarea class="form-textarea" id="template-editor" style="min-height:350px;background:#1e1e1e;color:#d4d4d4"></textarea>
          <div style="font-size:12px;color:#888;margin-top:8px">点击下方变量可快速插入</div>
        </div>
        <div class="preview-section">
          <div style="font-size:14px;font-weight:500;margin-bottom:8px">预览效果</div>
          <div class="preview" id="template-preview"></div>
        </div>
      </div>

      <div class="variables">
        <div style="font-size:13px;font-weight:500">可用变量</div>
        <div class="variable-list" id="variable-list"></div>
      </div>
    </div>
  </div>

  <!-- 添加/编辑账号弹窗 -->
  <div class="modal-overlay" id="account-modal" style="display:none" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title" id="modal-title">添加账号</div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">账号类型</label>
          <select class="form-select" id="account-platform" onchange="updateFormFields()">
            <option value="mimo">小米 MiMo</option>
            <option value="wasu">华数广电</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">账号名称</label>
          <input class="form-input" id="account-name" placeholder="自定义显示名称">
        </div>

        <!-- MiMo 字段 -->
        <div id="mimo-fields">
          <div class="form-group">
            <label class="form-label">小米账号 *</label>
            <input class="form-input" id="account-account" placeholder="手机号或邮箱">
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input class="form-input" id="account-password" type="password" placeholder="小米账号密码">
          </div>
        </div>

        <!-- 华数字段 -->
        <div id="wasu-fields" style="display:none">
          <div class="form-group">
            <label class="form-label">手机号 *</label>
            <input class="form-input" id="account-phone" placeholder="华数广电绑定的手机号">
          </div>
          <div class="form-group">
            <label class="form-label">User Key *</label>
            <input class="form-input" id="account-user-key" placeholder="从华数广电小程序获取">
          </div>
          <div class="form-group">
            <label class="form-label">Token *</label>
            <input class="form-input" id="account-token" placeholder="从华数广电小程序获取">
          </div>
          <div class="form-group">
            <label class="form-label">签名</label>
            <input class="form-input" id="account-sign" placeholder="可选">
          </div>
        </div>

        <div class="form-group full-width">
          <label class="form-label">User-Agent</label>
          <input class="form-input" id="account-ua" placeholder="留空使用默认值">
          <div class="form-hint">留空将使用默认 User-Agent</div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="hideModal()">取消</button>
        <button class="btn btn-primary" onclick="saveAccount()">保存</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let accounts = [];
    let editingIndex = -1;
    let currentTemplateTab = 'mimo';

    const DEFAULT_TEMPLATES = {
      mimo: `📋 {label}
────────────────
  余额        {balance}元
  赠送        {gift_balance}元
  输入        {input_token}
  输出        {output_token}
  缓存        {cache_token}
  本月费用    {monthly_cost}元
  累计费用    {total_cost}元`,
      wasu: `📺 {label}
────────────────
💰 账户余额: {balance}
   当月话费: {month_fee}
   欠费: {arrears}

📶 本月累计使用: {total_used}
   总流量: {total} | 已用: {used} | 剩余: {remain}

🕐 查询时间: {query_time}`
    };

    const VARIABLES = {
      mimo: ['label', 'balance', 'gift_balance', 'input_token', 'output_token', 'cache_token', 'monthly_cost', 'total_cost'],
      wasu: ['label', 'balance', 'month_fee', 'arrears', 'total_used', 'total', 'used', 'remain', 'query_time']
    };

    const SAMPLE_DATA = {
      mimo: { label: 'MiMo账号', balance: '177.40', gift_balance: '177.40', input_token: '10.3亿', output_token: '324.0万', cache_token: '9.8亿', monthly_cost: '120.93', total_cost: '132.60' },
      wasu: { label: '138****8888', balance: '¥56.80', month_fee: '¥38.50', arrears: '¥0.00', total_used: '15.62 GB', total: '30.00 GB', used: '15.62 GB', remain: '14.38 GB', query_time: '2026-08-21 23:00:00' }
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadAccounts();
      setupTabs();
      updateVariableList();
    });

    function setupTabs() {
      document.querySelectorAll('.tabs .tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const panel = tab.dataset.tab;
          document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          if (panel === 'accounts') {
            document.getElementById('accounts-panel').style.display = 'block';
            document.getElementById('templates-panel').style.display = 'none';
          } else {
            document.getElementById('accounts-panel').style.display = 'none';
            document.getElementById('templates-panel').style.display = 'block';
          }
        });
      });
    }

    // Account Management
    async function loadAccounts() {
      try {
        const resp = await fetch('/api/v1/plugins/astrbot_plugin_resource_query/config', {
          headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        const data = await resp.json();
        accounts = data.data?.accounts || [];
        renderAccounts();
      } catch (e) {
        console.error('加载失败:', e);
      }
    }

    function renderAccounts() {
      const list = document.getElementById('account-list');

      if (accounts.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>暂无账号，点击上方按钮添加</div></div>';
        return;
      }

      list.innerHTML = accounts.map((acc, i) => `
        <div class="account-card">
          <div class="account-header">
            <span class="account-name">${acc.name || acc.account || acc.phone || '账号' + (i+1)}</span>
            <span class="account-platform platform-${acc.platform}">${acc.platform === 'mimo' ? 'MiMo' : '华数广电'}</span>
          </div>
          <div class="account-info">
            ${acc.platform === 'mimo' ? `
              <div>账号: ${acc.account || '-'}</div>
              <div>userId: ${acc.userId || '-'}</div>
              <div>serviceToken: ${acc.serviceToken ? '✅ 已获取' : '❌ 未获取'}</div>
            ` : `
              <div>手机号: ${acc.phone || '-'}</div>
              <div>User Key: ${acc.user_key ? '✅ 已配置' : '❌ 未配置'}</div>
            `}
          </div>
          <div class="account-actions">
            <button class="btn btn-secondary btn-sm" onclick="editAccount(${i})">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="deleteAccount(${i})">删除</button>
          </div>
        </div>
      `).join('');
    }

    function showAddModal() {
      editingIndex = -1;
      document.getElementById('modal-title').textContent = '添加账号';
      document.getElementById('account-platform').value = 'mimo';
      document.getElementById('account-name').value = '';
      document.getElementById('account-account').value = '';
      document.getElementById('account-password').value = '';
      document.getElementById('account-phone').value = '';
      document.getElementById('account-user-key').value = '';
      document.getElementById('account-token').value = '';
      document.getElementById('account-sign').value = '';
      document.getElementById('account-ua').value = '';
      updateFormFields();
      document.getElementById('account-modal').style.display = 'flex';
    }

    function editAccount(index) {
      editingIndex = index;
      const acc = accounts[index];
      document.getElementById('modal-title').textContent = '编辑账号';
      document.getElementById('account-platform').value = acc.platform || 'mimo';
      document.getElementById('account-name').value = acc.name || '';
      document.getElementById('account-account').value = acc.account || '';
      document.getElementById('account-password').value = acc.password || '';
      document.getElementById('account-phone').value = acc.phone || '';
      document.getElementById('account-user-key').value = acc.user_key || '';
      document.getElementById('account-token').value = acc.token || '';
      document.getElementById('account-sign').value = acc.sign || '';
      document.getElementById('account-ua').value = acc.ua || '';
      updateFormFields();
      document.getElementById('account-modal').style.display = 'flex';
    }

    function hideModal() {
      document.getElementById('account-modal').style.display = 'none';
    }

    function closeModal(e) {
      if (e.target === document.getElementById('account-modal')) hideModal();
    }

    function updateFormFields() {
      const platform = document.getElementById('account-platform').value;
      document.getElementById('mimo-fields').style.display = platform === 'mimo' ? 'block' : 'none';
      document.getElementById('wasu-fields').style.display = platform === 'wasu' ? 'block' : 'none';
    }

    async function saveAccount() {
      const platform = document.getElementById('account-platform').value;
      const acc = {
        platform,
        name: document.getElementById('account-name').value,
        ua: document.getElementById('account-ua').value,
      };

      if (platform === 'mimo') {
        acc.account = document.getElementById('account-account').value;
        acc.password = document.getElementById('account-password').value;
        if (editingIndex >= 0) {
          acc.userId = accounts[editingIndex].userId || '';
          acc.passToken = accounts[editingIndex].passToken || '';
          acc.serviceToken = accounts[editingIndex].serviceToken || '';
        }
      } else {
        acc.phone = document.getElementById('account-phone').value;
        acc.user_key = document.getElementById('account-user-key').value;
        acc.token = document.getElementById('account-token').value;
        acc.sign = document.getElementById('account-sign').value;
      }

      if (editingIndex >= 0) {
        accounts[editingIndex] = acc;
      } else {
        accounts.push(acc);
      }

      await saveAccounts();
      hideModal();
      showStatus('accounts', '✅ 账号保存成功');
    }

    async function deleteAccount(index) {
      if (!confirm('确定删除此账号？')) return;
      accounts.splice(index, 1);
      await saveAccounts();
      showStatus('accounts', '✅ 账号已删除');
    }

    async function saveAccounts() {
      try {
        await fetch('/api/v1/plugins/astrbot_plugin_resource_query/config', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + getToken(),
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ accounts })
        });
        renderAccounts();
      } catch (e) {
        showStatus('accounts', '❌ 保存失败: ' + e.message, true);
      }
    }

    // Template Management
    function switchTemplateTab(tab) {
      currentTemplateTab = tab;
      document.querySelectorAll('#templates-panel .tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      updateVariableList();
      loadTemplate();
    }

    function updateVariableList() {
      const list = document.getElementById('variable-list');
      list.innerHTML = VARIABLES[currentTemplateTab].map(v =>
        `<div class="variable" onclick="insertVariable('${v}')">{${v}}</div>`
      ).join('');
    }

    function insertVariable(varName) {
      const editor = document.getElementById('template-editor');
      const pos = editor.selectionStart;
      editor.value = editor.value.slice(0, pos) + `{${varName}}` + editor.value.slice(pos);
      editor.focus();
      updatePreview();
    }

    function loadTemplate() {
      const account = accounts.find(a => a.platform === currentTemplateTab);
      document.getElementById('template-editor').value = account?.template || DEFAULT_TEMPLATES[currentTemplateTab];
      updatePreview();
    }

    function updatePreview() {
      const template = document.getElementById('template-editor').value;
      const sample = SAMPLE_DATA[currentTemplateTab];
      let result = template;
      for (const [key, value] of Object.entries(sample)) {
        result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), value);
      }
      document.getElementById('template-preview').textContent = result;
    }

    function resetTemplate() {
      document.getElementById('template-editor').value = DEFAULT_TEMPLATES[currentTemplateTab];
      updatePreview();
    }

    async function saveTemplate() {
      const template = document.getElementById('template-editor').value;
      let account = accounts.find(a => a.platform === currentTemplateTab);

      if (account) {
        account.template = template;
      } else {
        accounts.push({ platform: currentTemplateTab, template });
      }

      await saveAccounts();
      showStatus('template', '✅ 模板保存成功');
    }

    // Utilities
    function showStatus(type, message, isError = false) {
      const el = document.getElementById(`status-${type}`);
      el.textContent = message;
      el.className = `status show ${isError ? 'error' : 'success'}`;
      setTimeout(() => el.className = 'status', 3000);
    }

    function getToken() {
      // 从 URL 或 localStorage 获取 token
      return localStorage.getItem('astrbot_api_token') || '';
    }

    // Listen for template editor input
    document.getElementById('template-editor')?.addEventListener('input', updatePreview);
  </script>
</body>
</html>
