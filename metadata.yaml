# 插件唯一标识（全小写，以 astrbot_plugin_ 开头）
name: astrbot_plugin_resource_query

# 插件展示名（在 WebUI 插件市场中显示）
display_name: "资源查询"

# 插件完整描述（支持多行）
desc: "多平台资源查询插件，支持小米 MiMo 用量查询、华数广电流量/话费查询等"

# 插件市场卡片上的短描述（一句话）
short_desc: "查询小米 MiMo 用量、华数广电流量话费"

# 插件作者
author: "御命"

# 插件版本号（每次更新递增，触发 AstrBot 更新检测）
version: "3.6.1"

# 插件仓库地址（用于插件市场来源归属和安装）
repo: "https://github.com/lmwm/astrbot_plugin_resource_query"

# 声明支持的消息平台
support_platforms:
  - aiocqhttp
  - qq_official

# 声明兼容的 AstrBot 版本范围
astrbot_version: ">=4.0.0"